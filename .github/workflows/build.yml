name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore SitTimer.slnx

      - name: Build
        run: dotnet build SitTimer.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SitTimer.slnx --no-build --configuration Release --verbosity normal

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/SitTimer.App/SitTimer.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.version.outputs.VERSION }} --output publish/

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/SitTimer.App.exe
          generate_release_notes: true
